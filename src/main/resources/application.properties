spring.application.name=openSkill
spring.profiles.default=local
server.port=4312
spring.jackson.default-property-inclusion=non_null
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/internal/actuator
management.endpoint.health.show-details=never
skill.worker.enabled=true
skill.worker.poll-ms=1000
skill.dispatcher.mode=database
skill.auth.mode=container
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

# 企业模式默认禁用本机智能体，避免共享服务端登录身份。
skill.agent.mode=${SKILL_AGENT_MODE:disabled}
skill.agent.command=${SKILL_AGENT_COMMAND:codex}
skill.agent.timeout-seconds=240
skill.agent.network-enabled=${SKILL_AGENT_NETWORK_ENABLED:false}

# 模型配置只由服务端管理；密钥从环境注入，禁止保存到 Skill 或前端。
skill.agent.provider.source=${SKILL_MODEL_SOURCE:server}
skill.agent.provider.codex-home=${SKILL_AGENT_CODEX_HOME:${CODEX_HOME:${user.home}/.codex}}
skill.agent.provider.base-url=${SKILL_MODEL_BASE_URL:}
skill.agent.provider.model=${SKILL_MODEL_NAME:}
skill.agent.provider.api-key=${SKILL_MODEL_API_KEY:}
skill.agent.provider.reasoning-effort=${SKILL_MODEL_REASONING_EFFORT:}
