server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./data/openskill;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
skill.auth.mode=local
skill.demo.enabled=true
# Agent execution is opt-in; default local startup never reads personal model configuration.
skill.agent.mode=${SKILL_AGENT_MODE:disabled}
skill.agent.provider.source=${SKILL_MODEL_SOURCE:server}
