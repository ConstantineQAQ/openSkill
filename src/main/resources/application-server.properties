# Deployment template; requires externally provisioned schema and trusted identity integration.
server.address=127.0.0.1
spring.datasource.url=${SKILL_MYSQL_URL}
spring.datasource.username=${SKILL_MYSQL_USERNAME}
spring.datasource.password=${SKILL_MYSQL_PASSWORD}
spring.sql.init.mode=never
skill.auth.mode=container
skill.demo.enabled=false
skill.dispatcher.mode=database
skill.agent.mode=disabled
skill.agent.provider.source=server
